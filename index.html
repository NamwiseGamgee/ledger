<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Ledger</title>
<style>
/* ===== Colors =====
   green  #2A7C13 = anything that adds to your money
   red    #E11A45 = anything that takes money away
   blue   #0D47A1 = neutral actions, and money that is still owed to you
   forest #123F36, navy #030164 and plum #601D49 are used for the home screen cards */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#EBEFED; --line:#DDE3E0; --ink:#2C2C2C; --muted:#6B7470;
  --accent:#0D47A1; --accent-ink:#FFFFFF; --accent-soft:#E3ECF8;
  --in:#2A7C13; --in-fill:#2A7C13; --in-soft:#E3F1DE; --in-ink:#FFFFFF;
  --out:#E11A45; --out-fill:#E11A45; --out-soft:#FDE4E9; --out-ink:#FFFFFF;
  --saved:#6CC04A; --loan:#D81B60;
  --forest:#123F36; --navy:#030164; --plum:#601D49; --charcoal:#2C2C2C; --tile-edge:transparent;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1B2120; --surface-2:#262D2B; --line:#313A37; --ink:#ECEFEE; --muted:#9BA6A2;
    --accent:#8AB4F8; --accent-ink:#071A38; --accent-soft:#16284A;
    --in:#7FD162; --in-soft:#1C3514; --out:#FF7A96; --out-soft:#47121F;
    --saved:#4CAF50; --loan:#F06292; --tile-edge:rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1B2120; --surface-2:#262D2B; --line:#313A37; --ink:#ECEFEE; --muted:#9BA6A2;
    --accent:#8AB4F8; --accent-ink:#071A38; --accent-soft:#16284A;
    --in:#7FD162; --in-soft:#1C3514; --out:#FF7A96; --out-soft:#47121F;
    --saved:#4CAF50; --loan:#F06292; --tile-edge:rgba(255,255,255,.07);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{min-height:100%;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.in-text{color:var(--in)} .out-text{color:var(--out)} .quiet{color:var(--muted)} .owed-text{color:var(--accent)}

.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px calc(env(safe-area-inset-bottom,0px) + 48px)}
/* iPhone home-screen app: only when the page is drawn behind the clock and battery,
   push the top bar down so it starts below them */
.ios-app.under-bar .wrap{padding-top:max(calc(env(safe-area-inset-top,0px) + 10px), 58px)}

.topbar{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:10px}
.brand{font-size:19px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{display:block}
.icon-btn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--accent);font-weight:600;text-decoration:none;font-size:16px}

/* home tiles */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:148px;padding:18px 16px 16px;border-radius:24px;text-decoration:none}
.tile{color:#fff;box-shadow:inset 0 0 0 1px var(--tile-edge)}
.tile-total{background:var(--forest)}
.tile-owed{background:var(--navy)}
.tile-owed:hover{filter:brightness(1.15)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tile-label{font-weight:650;font-size:15.5px;line-height:1.25}
.tile-top svg{flex:none;margin-top:4px;color:#fff}
.tile-amt{display:block;color:#fff;font-size:clamp(21px,6.2vw,28px);font-weight:700;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.tile-amt.neg{color:#FFB3C2}
.debt-pill{display:table;margin:10px 0 0 auto;background:#E11A45;color:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;line-height:1.25;white-space:nowrap}
.after-debt{color:var(--muted);font-size:14px;margin:6px 0 0}
.after-debt strong{font-weight:700}
.tile-sub{display:block;color:rgba(255,255,255,.78);font-size:13px;line-height:1.35;margin-top:4px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 20px 20px}
.panel-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.015em;overflow-wrap:anywhere}
.link{color:var(--accent);font-weight:600;text-decoration:none;font-size:15px;padding:8px 0;white-space:nowrap}
.big{font-size:44px;font-weight:700;letter-spacing:-.02em;margin:18px 0 0;line-height:1.05}
.caption{color:var(--muted);font-size:15px;margin:4px 0 0}

.ribbon{display:flex;gap:2px;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin:18px 0 16px}
.ribbon span{min-width:3px}
.ribbon .saved{background:var(--saved)}
.ribbon.thin{height:6px;gap:1px;margin:12px 0 0}

.io{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.io.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.io span{display:block;color:var(--muted);font-size:13.5px}
.io strong{display:block;font-size:18px;font-weight:600;margin-top:2px}

.btn{border:0;border-radius:14px;min-height:48px;padding:0 14px;font-weight:600;font-size:15px;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn svg{flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.in-fill:active,.btn.out-fill:active,.btn.primary:active{filter:brightness(.92)}
.btn.in{background:var(--in-soft);color:var(--in)}
.btn.out{background:var(--out-soft);color:var(--out)}
.btn.in-fill{background:var(--in-fill);color:var(--in-ink)}
.btn.out-fill{background:var(--out-fill);color:var(--out-ink)}
.btn.plain{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;color:var(--out)}
.btn.wide{width:100%;margin-top:24px}
.row-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:20px}
.add-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:20px}
.add-row .btn,.row-btns .btn{padding:0 8px;gap:5px;white-space:nowrap}

h2{font-size:17px;font-weight:650;margin:32px 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.h-meta{font-size:13.5px;font-weight:500;color:var(--muted)}
.section-note{color:var(--muted);font-size:14px;line-height:1.45;margin:-4px 4px 10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.empty{color:var(--muted);padding:18px 16px;font-size:15px;line-height:1.5;margin:0}
.footnote{color:var(--muted);font-size:14px;margin:12px 4px 0;line-height:1.5}

.mrow{display:block;padding:15px 16px;text-decoration:none}
.mrow:hover,.entry:hover,.prow:hover{background:var(--surface-2)}
.mrow-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.mrow-name{font-weight:600;font-size:17px}
.mrow-net{font-weight:700;font-size:17px}
.mrow-sub{color:var(--muted);font-size:13.5px;margin-top:3px}

.ins-card{display:block;text-decoration:none;background:var(--plum);color:#fff;border-radius:22px;padding:16px 20px 18px;margin-top:12px;box-shadow:inset 0 0 0 1px var(--tile-edge)}
.ins-card:hover{filter:brightness(1.12)}
.ins-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ins-top svg{flex:none;color:#fff}
.ins-label{display:block;font-weight:650;font-size:16px}
.ins-sub{display:block;color:rgba(255,255,255,.78);font-size:13.5px;line-height:1.4;margin-top:3px}
.ins-card .ribbon{background:rgba(255,255,255,.18)}
.ins-card .ribbon .saved{background:#8BDB6A}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.sm{width:8px;height:8px;margin-right:7px;vertical-align:1px}
.cat-row{display:grid;grid-template-columns:10px 1fr auto;column-gap:10px;row-gap:8px;align-items:center;padding:14px 16px}
.cat-row.zero{opacity:.5}
.cat-name{font-weight:600}
.cat-name small{display:block;color:var(--muted);font-weight:500;font-size:13px;margin-top:2px}
.cat-amt{font-weight:600;text-align:right}
.cat-amt small{color:var(--muted);font-weight:500;margin-left:8px;font-size:13px}
.cat-bar{grid-column:2 / 4;height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.cat-bar span{display:block;height:100%;border-radius:999px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;gap:12px}
.kv small{color:var(--muted);font-size:13.5px;margin-left:6px}
.kv strong{font-weight:600}

/* entries */
.entry{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:0;padding:12px 16px}
.badge{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.badge.in{background:var(--in-soft);color:var(--in)}
.badge.out{background:var(--out-soft);color:var(--out)}
.badge.done{background:var(--surface-2);color:var(--muted)}
.entry-main{min-width:0}
.entry-title{display:block;font-weight:600}
.entry-note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:14.5px;margin-top:2px;line-height:1.4;overflow-wrap:anywhere}
.entry-side{text-align:right}
.entry-amt{display:block;font-weight:600}
.entry-date{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.of{font-weight:500;color:var(--muted);font-size:13.5px}
.struck{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.res-month{display:flex;justify-content:space-between;gap:12px;padding:9px 16px;background:var(--surface-2);font-size:13.5px;font-weight:600;color:var(--muted)}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px;min-height:52px;margin-bottom:12px;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;color:var(--ink);padding:12px 0;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search button{border:0;background:var(--surface-2);color:var(--muted);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;flex:none}
.results{margin-bottom:8px}
.results h2:first-child{margin-top:8px}

/* people */
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;text-decoration:none}
.prow-name{display:block;font-weight:600;font-size:17px;overflow-wrap:anywhere}
.prow-sub{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.prow-amt{font-weight:700;font-size:17px;white-space:nowrap}
.loan{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding-right:12px}
.loan .entry{padding-right:0}
.mini{border:0;border-radius:10px;min-height:36px;padding:0 12px;font-size:14px;font-weight:600;background:var(--surface-2);white-space:nowrap}
.mini.in-fill{background:var(--in-fill);color:var(--in-ink)}
.mini.out-fill{background:var(--out-fill);color:var(--out-ink)}
.owed-big{font-size:27px !important;font-weight:700 !important;letter-spacing:-.02em}
.io-sub{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.mini.danger{background:transparent;color:var(--out)}

.cat-item{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 10px 10px 16px}
.cat-item-main{min-width:0}
.cat-item .cat-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-count{display:block;color:var(--muted);font-size:13px;margin-top:1px}

.banner{background:var(--surface);border:1px solid var(--out);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.45;margin-bottom:14px}

/* sheets */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(18,28,26,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 20px);animation:up .26s cubic-bezier(.2,.8,.2,1)}
@media (min-width:640px){.overlay{align-items:center;padding:24px}.sheet{border-radius:26px;padding-bottom:22px}}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:20px;margin:0 0 16px;font-weight:700}
.sheet h4.sub{font-size:16px;font-weight:650;margin:24px 0 10px}
.sheet .list{background:var(--bg)}
.help{color:var(--muted);font-size:14.5px;line-height:1.5;margin:6px 0 0}
.seg{display:grid;grid-template-columns:repeat(var(--segs,2),1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg button{border:0;background:transparent;border-radius:10px;min-height:40px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--in);box-shadow:0 1px 3px rgba(20,40,35,.14)}
.seg button[data-t="expense"][aria-pressed="true"]{color:var(--out)}
.amount-field{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:4px 0;margin-top:22px}
.amount-field span{font-size:30px;font-weight:600;color:var(--muted)}
.amount-field input{flex:1;min-width:0;border:0;outline:none;background:transparent;padding:0;font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.is-in .amount-field:focus-within{border-color:var(--in)}
.is-out .amount-field:focus-within{border-color:var(--out)}
.is-in .amount-field span{color:var(--in)}
.is-out .amount-field span{color:var(--out)}
.calc{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.calc-keys{display:flex;gap:6px}
.calc-keys button{width:42px;height:36px;border:0;border-radius:10px;background:var(--surface-2);font-size:19px;font-weight:600;color:var(--ink);line-height:1}
.calc-keys button:active{background:var(--line)}
.calc-result{font-weight:700;font-size:17px;color:var(--ink);text-align:right}
.err{color:var(--out);font-size:14px;min-height:20px;margin:6px 0 0}
.field{display:block;margin-top:14px}
.field > span{display:block;color:var(--muted);font-size:14px;margin-bottom:6px}
.input{display:block;width:100%;min-height:48px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px;-webkit-appearance:none;appearance:none}
.input:focus{outline:none;border-color:var(--accent)}
input[type="date"].input::-webkit-date-and-time-value{text-align:left}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);font-weight:600}
.chip.add-chip{border-style:dashed;color:var(--muted)}
.new-cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.swatch{width:34px;height:34px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.actions{display:grid;gap:8px;margin-top:22px}
.swatch.rainbow{position:relative;overflow:hidden;background:conic-gradient(#FF1744,#FFEA00,#00E676,#00E5FF,#2979FF,#D500F9,#FF1744)}
.swatch.rainbow input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.pk-top{display:flex;align-items:center;gap:10px;margin-top:16px}
.pk-preview{width:48px;height:48px;border-radius:14px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pk-hex{font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.04em}
.pk-row{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:12px;margin-top:14px;font-size:14px;color:var(--muted)}
input.pk{-webkit-appearance:none;appearance:none;width:100%;height:14px;margin:0;border-radius:999px;outline:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
#pk-h{background:linear-gradient(90deg,#FF0000,#FFFF00,#00FF00,#00FFFF,#0000FF,#FF00FF,#FF0000)}
input.pk::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.3)}
input.pk::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.3)}
input.pk:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.data-box{background:var(--bg);border-radius:16px;padding:14px 16px;margin-top:18px}
.data-box strong{display:block;font-size:15.5px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--charcoal);color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:12px 18px;border-radius:18px;font-size:15px;font-weight:600;max-width:calc(100% - 36px);text-align:center;transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.overlay,.sheet{animation:none}.toast{transition:none}}
@media (max-width:360px){.big{font-size:38px}.add-row .btn,.row-btns .btn{font-size:14px;padding:0 6px}.tile{padding:16px 13px 14px}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restore-input" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';

/* ================= settings & data ================= */
const KEY = 'ledger.v1';   // never change this, or saved data won't be found
// Soft colors that categories pick from.
// Bright quick-pick colors for categories. You can also pick any color with the color picker.
const PALETTE = ['#00A676','#1E88E5','#FB8C00','#8E24AA','#607D8B','#E91E63','#00ACC1','#F9A825','#3F51B5','#8D6E63','#7CB342','#BA68C8'];
// The softer colors older versions used. Categories still on one of these get the bright color in the same spot.
const OLD_PASTELS = ['#8BB39C','#7E9FBE','#E0AE85','#A597C6','#B9B2A5','#D99AA6','#7FB8B8','#C9B87A','#9AAFD1','#B89A84','#A3C48F','#C7A2C4'];
// The starting categories. You can rename, recolor or delete any of them in the app.
const DEFAULT_CATS = [
  {id:'grocery', name:'Grocery', color:'#00A676'},
  {id:'rent', name:'Rent', color:'#1E88E5'},
  {id:'restaurants', name:'Restaurants', color:'#FB8C00'},
  {id:'car', name:'Car maintenance', color:'#8E24AA'},
  {id:'other', name:'Other expense', color:'#607D8B'}
];
const HEX = /^#[0-9a-fA-F]{6}$/;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TYPES = ['salary','expense','deposit'];
const TYPE_NAME = {salary:'Salary', expense:'Expense', deposit:'Deposit'};

  salary:'e.g. Week 2 paycheck (optional)',

const cleanId = v => String(v || '').replace(/[^\w-]/g,'');
function cleanCats(list){
  if(!Array.isArray(list)) return null;
  const out = [];
  for(const c of list){
    if(!c || typeof c.name !== 'string' || !c.name.trim()) continue;
    const id = cleanId(c.id);
    if(!id || out.some(x => x.id === id)) continue;
    out.push({id:id, name:c.name.trim().slice(0,30), color: HEX.test(c.color) ? c.color : PALETTE[out.length % PALETTE.length]});
  }
  return out;
}
// Older saved data has no category list, so it gets the starting five.
// Any expense whose category is missing gets one again, so nothing disappears.
function ensureCategories(st){
  if(!st.categories || !st.categories.length) st.categories = DEFAULT_CATS.map(c => Object.assign({}, c));
  for(const e of st.entries){
    if(e.type !== 'expense' || st.categories.some(c => c.id === e.category)) continue;
    const def = DEFAULT_CATS.find(c => c.id === e.category);
    if(def){ st.categories.push(Object.assign({}, def)); continue; }
    let un = st.categories.find(c => c.id === 'uncategorized');
    if(!un){ un = {id:'uncategorized', name:'Uncategorized', color:'#607D8B'}; st.categories.push(un); }
    e.category = un.id;
  }
  return st;
}
function cleanPeople(list){
  if(!Array.isArray(list)) return [];
  const out = [];
  for(const p of list){
    if(!p || typeof p.name !== 'string' || !p.name.trim()) continue;
    const id = cleanId(p.id);
    if(!id || out.some(x => x.id === id)) continue;
    out.push({id:id, name:p.name.trim().slice(0,40), createdAt:Number(p.createdAt) || Date.now()});
  }
  return out;
}
function cleanDebts(list, people){
  if(!Array.isArray(list)) return [];
  const out = [];
  for(const d of list){
    if(!d || !['lent','paid','borrowed','repaid'].includes(d.type)) continue;
    if(!Number.isInteger(d.amount) || d.amount <= 0 || !DATE_RE.test(d.date)) continue;
    const personId = cleanId(d.personId);
    if(!people.some(p => p.id === personId)) continue;
    const r = {id: cleanId(d.id) || uid(), personId:personId, type:d.type, amount:d.amount, date:d.date,
               note: typeof d.note === 'string' ? d.note.slice(0,300) : '', createdAt: Number(d.createdAt) || Date.now()};
    // Whether a loan is paid off is worked out from the payments, so older "settled" flags are dropped.
    if((d.type === 'paid' || d.type === 'repaid') && d.loanId) r.loanId = cleanId(d.loanId);
    out.push(r);
  }
  return out;
}
function normalize(d){
  d = d || {};
  const people = cleanPeople(d.people);
  const categories = cleanCats(d.categories);
  if(categories && !d.colorsV2){
    categories.forEach(c => { const i = OLD_PASTELS.indexOf(c.color.toUpperCase()); if(i >= 0) c.color = PALETTE[i]; });
  }
  return ensureCategories({
    colorsV2: true,
    currency: typeof d.currency === 'string' && d.currency ? d.currency.slice(0,4) : '$',
    lastBackup: d.lastBackup || null,
    categories: categories,
    entries: Array.isArray(d.entries) ? d.entries : [],
    people: people,
    debts: cleanDebts(d.debts, people)
  });
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.entries)) return normalize(d); }
  }catch(e){}
  return normalize({});
}
let state = load();

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }
  catch(e){ toast('Could not save. This browser is blocking storage.'); return false; }
}

const pad = n => String(n).padStart(2,'0');
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
const monthOf = s => s.slice(0,7);
const currentMonth = () => monthOf(todayStr());
function monthLabel(k){ const [y,m] = k.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); }
function monthName(k){ const [y,m] = k.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long'}); }
function dayLabel(s){
  const [y,m,d] = s.split('-').map(Number);
  const opts = {month:'short', day:'numeric'};
  if(y !== new Date().getFullYear()) opts.year = 'numeric';
  return new Date(y,m-1,d).toLocaleDateString(undefined, opts);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function money(cents, opts){
  const sign = opts && opts.sign;
  const abs = (Math.abs(cents)/100).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
  let pre = '';
  if(cents < 0) pre = '\u2212'; else if(sign && cents > 0) pre = '+';
  return pre + esc(state.currency) + abs;
}
// Works like a calculator: "344.87-3.87" gives 341.00. Handles + - x / and brackets.
// Returns cents, or NaN if the amount can't be worked out.
function parseAmount(str){
  const src = String(str).replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/,/g,'').replace(/[^0-9.+\-*/()]/g,'');
  if(!src) return NaN;
  let i = 0;
  const peek = () => src[i];
  function num(){ const m = src.slice(i).match(/^(\d+\.?\d*|\.\d+)/); if(!m) throw 0; i += m[0].length; return parseFloat(m[0]); }
  function factor(){
    const c = peek();
    if(c === '-'){ i++; return -factor(); }
    if(c === '+'){ i++; return factor(); }
    if(c === '('){ i++; const v = expr(); if(peek() !== ')') throw 0; i++; return v; }
    return num();
  }
  function term(){ let v = factor(); while(peek() === '*' || peek() === '/'){ const op = src[i++]; const r = factor(); v = op === '*' ? v * r : v / r; } return v; }
  function expr(){ let v = term(); while(peek() === '+' || peek() === '-'){ const op = src[i++]; const r = term(); v = op === '+' ? v + r : v - r; } return v; }
  try{
    const v = expr();
    if(i !== src.length || !isFinite(v)) return NaN;
    return Math.round(v * 100);
  }catch(e){ return NaN; }
}
const moneyText = c => money(c).replace(/&amp;/g,'&');
// The amount box plus + - x / keys (the iPhone number keyboard has no math keys) and a live result.
function amountField(id, value){
  const keys = [['+','+','Plus'],['-','−','Minus'],['*','×','Times'],['/','÷','Divided by']];
  return '<label class="amount-field"><span>'+esc(state.currency)+'</span>' +
      '<input id="'+id+'" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="Amount" value="'+value+'"></label>' +
    '<div class="calc"><span class="calc-keys">' +
      keys.map(k => '<button type="button" data-op="'+k[0]+'" aria-label="'+k[2]+'">'+k[1]+'</button>').join('') +
    '</span><span class="calc-result num" id="'+id+'-res" aria-live="polite"></span></div>';
}
function wireCalc(sheet, input){
  const res = sheet.querySelector('#'+input.id+'-res');
  function update(){
    const raw = input.value;
    const hasMath = /[0-9.)]\s*[-+*/×÷xX−]/.test(raw);
    const v = parseAmount(raw);
    res.textContent = hasMath && isFinite(v) ? '= ' + moneyText(v) : '';
  }
  sheet.querySelectorAll('[data-op]').forEach(b => {
    b.addEventListener('pointerdown', e => e.preventDefault());   // keeps the keyboard open
    b.addEventListener('click', () => {
      const len = input.value.length;
      const a = input.selectionStart == null ? len : input.selectionStart;
      const z = input.selectionEnd == null ? len : input.selectionEnd;
      input.value = input.value.slice(0, a) + b.dataset.op + input.value.slice(z);
      input.focus();
      try{ input.setSelectionRange(a + 1, a + 1); }catch(e){}
      input.dispatchEvent(new Event('input'));
    });
  });
  input.addEventListener('input', update);
  update();
}
const netClass = n => n > 0 ? 'in-text' : n < 0 ? 'out-text' : 'quiet';
function pctOf(v, total){
  if(!total) return '\u2014';
  const p = v / total * 100;
  return (v > 0 && p < 1) ? '<1%' : Math.round(p) + '%';
}
const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

const cats = () => state.categories;
const catById = id => state.categories.find(c => c.id === id);
const catOf = e => catById(e.category) || state.categories[0];
function nextColor(){
  const used = new Set(cats().map(c => c.color.toUpperCase()));
  return PALETTE.find(p => !used.has(p)) || PALETTE[cats().length % PALETTE.length];
}
function checkCatName(name, exceptId){
  if(!name) return 'Type a name for the category.';
  const same = cats().find(c => c.id !== exceptId && c.name.toLowerCase() === name.toLowerCase());
  if(same) return 'You already have a category called \u201c'+same.name+'\u201d.';
  return '';
}

  const problem = checkCatName(name);
  if(problem) return {error:problem};
  const c = {id:'c_'+uid(), name:name, color: HEX.test(color || '') ? color : nextColor()};
  state.categories.push(c);
  return {cat:c};
}

/* monthly numbers: budget entries plus money lent, borrowed and paid back */
const DEBT_IN = {paid:true, borrowed:true};          // these add to your money; lent and repaid take it away
const isLoan = t => t === 'lent' || t === 'borrowed';
const PAY_FOR = {lent:'paid', borrowed:'repaid'};
function statsWhere(test){
  const s = {salary:0, deposit:0, spent:0, paychecks:0, cats:{}, entries:[], debts:[],
             lent:0, paid:0, borrowed:0, repaid:0, loanIn:0, loanOut:0};
  cats().forEach(c => s.cats[c.id] = 0);
  for(const e of state.entries){
    if(!test(e)) continue;
    s.entries.push(e);
    if(e.type === 'salary'){ s.salary += e.amount; s.paychecks++; }
    else if(e.type === 'deposit'){ s.deposit += e.amount; }
    else { s.spent += e.amount; s.cats[catOf(e).id] += e.amount; }
  }
  // Money only counts when it actually moves: lending or repaying takes it out,
  // getting paid back or borrowing brings it in. What people still owe you never counts.
  for(const d of state.debts){
    if(!test(d)) continue;
    s.debts.push(d);
    s[d.type] += d.amount;
    if(DEBT_IN[d.type]) s.loanIn += d.amount; else s.loanOut += d.amount;
  }
  s.income = s.salary + s.deposit;
  s.cameIn = s.income + s.loanIn;
  s.wentOut = s.spent + s.loanOut;
  s.net = s.cameIn - s.wentOut;
  s.count = s.entries.length + s.debts.length;
  return s;
}
const statsFor = k => statsWhere(x => monthOf(x.date) === k);   // one month only
const statsAll = () => statsWhere(() => true);                   // every month
function allMonths(){
  const set = new Set(state.entries.map(e => monthOf(e.date)).concat(state.debts.map(d => monthOf(d.date))));
  set.add(currentMonth());
  return [...set].sort().reverse();
}
const byNewest = (a,b) => b.date.localeCompare(a.date) || (b.createdAt||0) - (a.createdAt||0);
// Kept = what you saved, as a share of what you earned (salary and deposits).
// Money you borrow isn't yours, so it isn't counted as kept, and repaying it isn't counted against you.
// Money you lend counts as going out, and paybacks count as coming back.
const keptPct = s => {
  if(!s.income) return 0;
  const kept = s.net - s.borrowed + s.repaid;
  const pct = Math.max(0, kept / s.income * 100);
  return Math.round(pct * 10) / 10;
};

/* loans between you and other people */
const personById = id => state.people.find(p => p.id === id);
const byOldest = (a,b) => a.date.localeCompare(b.date) || (a.createdAt||0) - (b.createdAt||0);
// Works out how much of each loan is still unpaid.
// Every payment goes to the oldest open loan first. A payment made with "Mark paid"
// goes to its own loan first. Anything left over moves on to the next oldest loan.
function allocate(ds){
  const out = {};
  ['lent','borrowed'].forEach(type => {
    const loans = ds.filter(d => d.type === type).sort(byOldest);
    loans.forEach(l => { out[l.id] = {rem:l.amount, paidOn:null}; });
    ds.filter(d => d.type === PAY_FOR[type]).sort(byOldest).forEach(p => {
      let left = p.amount;
      const apply = l => {
        const r = out[l.id], take = Math.min(r.rem, left);
        if(take <= 0) return;
        r.rem -= take; left -= take;
        if(r.rem === 0) r.paidOn = p.date;
      };
      const own = p.loanId && loans.find(l => l.id === p.loanId);
      if(own) apply(own);
      for(const l of loans){ if(left <= 0) break; apply(l); }
    });
  });
  return out;
}
function personStats(pid){
  const ds = state.debts.filter(d => d.personId === pid);
  const t = {lent:0, paid:0, borrowed:0, repaid:0};
  let last = '';
  for(const d of ds){ t[d.type] += d.amount; if(d.date > last) last = d.date; }
  const alloc = allocate(ds);
  const theyOwe = t.lent - t.paid, iOwe = t.borrowed - t.repaid;
  const open = type => ds.filter(d => d.type === type && alloc[d.id].rem > 0);
  return {ds:ds, alloc:alloc, lent:t.lent, paid:t.paid, borrowed:t.borrowed, repaid:t.repaid,
    theyOwe:theyOwe, iOwe:iOwe, net:theyOwe - iOwe, last:last,
    openLent: open('lent'), openBorrowed: open('borrowed'),
    paidLoans: ds.filter(d => isLoan(d.type) && alloc[d.id].rem === 0)};
}
// Positive net = they owe you. Negative net = you owe them.
function owedTotals(){
  const r = {theyOwe:0, iOwe:0, owers:0, owees:0};
  state.people.forEach(p => {
    const n = personStats(p.id).net;
    if(n > 0){ r.theyOwe += n; r.owers++; } else if(n < 0){ r.iOwe -= n; r.owees++; }
  });
  return r;
}
function findOrCreatePerson(name){
  name = name.trim().slice(0,40);
  const same = state.people.find(p => p.name.toLowerCase() === name.toLowerCase());
  if(same) return same;
  const p = {id:'p_'+uid(), name:name, createdAt:Date.now()};
  state.people.push(p);
  return p;
}
const peopleCount = n => n === 1 ? '1 person' : n + ' people';
function summary(pid){
  const p = personById(pid), n = personStats(pid).net;
  return n > 0 ? p.name+' owes you '+moneyText(n) : n < 0 ? 'You owe '+p.name+' '+moneyText(-n) : 'You and '+p.name+' are all square';
}

function ribbon(s, thin){
  const cls = 'ribbon' + (thin ? ' thin' : '');
  if(s.cameIn === 0 && s.wentOut === 0) return '<div class="'+cls+'" aria-hidden="true"></div>';
  let segs = cats().filter(c => s.cats[c.id] > 0)
    .map(c => '<span style="flex:'+s.cats[c.id]+';background:'+c.color+'"></span>').join('');
  if(s.loanOut > 0) segs += '<span style="flex:'+s.loanOut+';background:var(--loan)"></span>';
  if(s.net > 0) segs += '<span class="saved" style="flex:'+s.net+'"></span>';
  const label = s.net >= 0 ? Math.round(s.cameIn ? s.wentOut/s.cameIn*100 : 0)+' percent of the money that came in went out' : 'More went out than came in';
  return '<div class="'+cls+'" role="img" aria-label="'+label+'">'+segs+'</div>';
}

    '<span class="entry-main"><span class="entry-title">'+DEBT_LABEL[d.type](esc(p ? p.name : 'Someone'))+'</span>' +
      (d.note ? '<span class="entry-note">'+esc(d.note)+'</span>' : '') + '</span>' +
    '<span class="entry-side"><span class="entry-amt num '+(inn ? 'in-text' : 'out-text')+'">'+money(inn ? d.amount : -d.amount, {sign:true})+'</span>' +
      '<span class="entry-date">'+dayLabel(d.date)+'</span></span>' +
  '</button>';
}
const rowFor = x => x.personId ? debtRow(x) : entryRow(x);
const signedAmt = x => x.personId ? (DEBT_IN[x.type] ? x.amount : -x.amount) : (x.type === 'expense' ? -x.amount : x.amount);

function inOut(s, three){
  return '<div class="io'+(three ? ' three' : '')+'"><div><span>Came in</span><strong class="num in-text">'+money(s.cameIn)+'</strong></div>' +
    '<div><span>Went out</span><strong class="num out-text">'+money(s.wentOut)+'</strong></div>' +
    (three ? '<div><span>Kept</span><strong class="num">'+keptPct(s)+'%</strong></div>' : '') + '</div>';
}

function renderHome(){
  const cur = currentMonth();
  const s = statsFor(cur);
  const others = allMonths().filter(k => k !== cur);
  const caption = s.count === 0
    ? 'Add your first paycheck of '+monthName(cur)+' to get started.'
    : s.net < 0 ? 'more went out than came in so far' : 'saved so far this month';

  // Total savings only counts months that are over (before the current month).
  const finished = allMonths().filter(k => k < cur && statsFor(k).count > 0);
  const total = finished.reduce((sum,k) => sum + statsFor(k).net, 0);
  const totalSub = finished.length ? 'Across '+plural(finished.length,'finished month') : monthName(cur)+' is added when it ends';
  const o = owedTotals();
  const owedSub = o.iOwe > 0 ? 'You owe '+money(o.iOwe) : o.owers ? 'From '+peopleCount(o.owers) : 'Nobody owes you';

  let html = topbar('<div class="brand">'+BRAND+'Ledger</div>') + banner();
  html += '<div class="duo">' +
    '<section class="tile tile-total" aria-label="Total savings">' +
      '<span class="tile-label">Total savings</span>' +
      '<div><span class="tile-amt num'+(total < 0 ? ' neg' : '')+'">'+money(total)+'</span><span class="tile-sub">'+totalSub+'</span></div>' +
    '</section>' +
    '<a class="tile tile-owed" href="#owed">' +
      '<span class="tile-top"><span class="tile-label">Owed to you</span>'+ICON_CHEVRON+'</span>' +
      '<div><span class="tile-amt num">'+money(o.theyOwe)+'</span><span class="tile-sub num">'+owedSub+'</span>' +
        (o.iOwe > o.theyOwe ? '<span class="debt-pill num">Total Debt '+money(o.iOwe - o.theyOwe)+'</span>' : '') + '</div>' +
    '</a>' +
  '</div>';

  html += '<section class="panel">' +
    '<div class="panel-top"><h1>'+monthLabel(cur)+'</h1><a class="link" href="#m='+cur+'">See breakdown</a></div>' +
    '<p class="big num '+netClass(s.net)+'">'+money(s.net)+'</p>' +
    '<p class="caption">'+caption+'</p>' +
    (o.iOwe > 0 && s.count ? '<p class="after-debt num"><strong class="'+netClass(s.net - o.iOwe)+'">'+money(s.net - o.iOwe)+'</strong> after paying what you owe</p>' : '') +
    ribbon(s) + inOut(s) + addRow(cur) +
  '</section>';

  html += '<a class="ins-card" href="#insights">' +
    '<div class="ins-top"><span><span class="ins-label">All-time insights</span>' +
    '<span class="ins-sub">Category shares of your income, and search across every entry</span></span>'+ICON_CHEVRON+'</div>' +
    ribbon(statsAll(), true) +
  '</a>';

  html += '<h2>Previous months</h2><div class="list">';
  if(others.length === 0){
    html += '<p class="empty">When '+monthName(cur)+' ends, it moves here with its net savings, and a fresh month starts at the top.</p>';
  } else {
    html += others.map(k => {
      const m = statsFor(k);
      return '<a class="mrow" href="#m='+k+'">' +
        '<div class="mrow-top"><span class="mrow-name">'+monthLabel(k)+'</span>' +
        '<span class="mrow-net num '+netClass(m.net)+'">'+money(m.net,{sign:true})+'</span></div>' +
        '<div class="mrow-sub num">In <span class="in-text">'+money(m.cameIn)+'</span>&ensp;Out <span class="out-text">'+money(m.wentOut)+'</span></div>' +
        ribbon(m, true) +
      '</a>';
    }).join('');
  }
  return html + '</div>';
}

function loanSection(s){
  if(!s.debts.length) return '';
  const rows = [
    ['Lent to others', s.lent, false], ['Paid back to you', s.paid, true],
    ['Borrowed', s.borrowed, true], ['You paid back', s.repaid, false]
  ].filter(r => r[1] > 0);
  return '<h2>Loans</h2><p class="section-note">Only money that actually changed hands counts toward this month.</p><div class="list">' +
    rows.map(r => '<div class="kv"><span>'+r[0]+'</span><strong class="num '+(r[2] ? 'in-text' : 'out-text')+'">'+money(r[2] ? r[1] : -r[1], {sign:true})+'</strong></div>').join('') +
  '</div>';
}

function renderMonth(k){
  const s = statsFor(k);
  const isCur = k === currentMonth();
  const items = s.entries.concat(s.debts).sort(byNewest);
  const caption = s.count === 0 ? 'Nothing logged yet'
    : s.net < 0 ? (isCur ? 'more went out than came in so far' : 'more went out than came in')
    : (isCur ? 'saved so far' : 'net savings');

  let html = topbar(backLink('#','All months')) + banner();
  html += '<section class="panel">' +
    '<h1>'+monthLabel(k)+'</h1>' +
    '<p class="big num '+netClass(s.net)+'">'+money(s.net)+'</p>' +
    '<p class="caption">'+caption+'</p>' +
    ribbon(s) + inOut(s, true) + addRow(k) +
  '</section>';

  const order = cats().slice().sort((a,b) => s.cats[b.id] - s.cats[a.id]);
  html += '<h2>Spending by category</h2><p class="section-note">Only expenses from '+monthLabel(k)+'.</p><div class="list">' + order.map(c => {
    const v = s.cats[c.id];
    const pct = s.spent ? Math.round(v/s.spent*100) : 0;
    return '<div class="cat-row'+(v ? '' : ' zero')+'"><i class="dot" style="background:'+c.color+'"></i>' +
      '<span class="cat-name">'+esc(c.name)+'</span>' +
      '<span class="cat-amt num">'+money(v)+'<small>'+(s.spent ? pctOf(v, s.spent) : '0%')+'</small></span>' +
      '<div class="cat-bar"><span style="width:'+pct+'%;background:'+c.color+'"></span></div></div>';
  }).join('') + '</div>';

  html += '<h2>Money in</h2><div class="list">' +
    '<div class="kv"><span>Salary<small>'+plural(s.paychecks,'paycheck')+'</small></span><strong class="num in-text">'+money(s.salary)+'</strong></div>' +
    (s.deposit ? '<div class="kv"><span>Deposits</span><strong class="num in-text">'+money(s.deposit)+'</strong></div>' : '') + '</div>';
  html += loanSection(s);

  html += '<h2>Entries</h2><div class="list">' + (items.length
    ? items.map(rowFor).join('')
    : '<p class="empty">Nothing logged for '+monthLabel(k)+' yet. Use the buttons above to add a paycheck, an expense, or a deposit.</p>') + '</div>';
  if(s.entries.length){
    html += '<button class="btn danger wide" data-action="delete-month" data-month="'+k+'">Delete all of '+monthLabel(k)+'</button>';
  }
  return html;
}

/* ----- search (on the insights page) ----- */
let searchQuery = '';
function matchesCategory(e, q){
  const name = e.type === 'expense' ? catOf(e).name : TYPE_NAME[e.type];
  return name.toLowerCase().includes(q);
}
function resultGroup(list){
  // Newest first, with a subtotal line for each month.
  let html = '', month = '';
  list.sort(byNewest).forEach(x => {
    const k = monthOf(x.date);
    if(k !== month){
      month = k;
      const net = list.filter(y => monthOf(y.date) === k).reduce((s,y) => s + signedAmt(y), 0);
      html += '<div class="res-month"><span>'+monthLabel(k)+'</span><span class="num '+netClass(net)+'">'+money(net,{sign:true})+'</span></div>';
    }
    html += rowFor(x);
  });
  return html;
}
function groupMeta(list){
  const out = list.filter(x => signedAmt(x) < 0).reduce((s,x) => s - signedAmt(x), 0);
  const inn = list.filter(x => signedAmt(x) > 0).reduce((s,x) => s + signedAmt(x), 0);
  const parts = [list.length === 1 ? '1 entry' : list.length+' entries'];
  if(out) parts.push(money(out)+' out');
  if(inn) parts.push(money(inn)+' in');
  return parts.join(', ');
}
function searchResults(raw){
  const q = raw.trim().toLowerCase();
  if(!q) return '';
  const byCat = state.entries.filter(e => matchesCategory(e, q));
  const byNote = state.entries.filter(e => !byCat.includes(e) && (e.note || '').toLowerCase().includes(q));
  const byLoan = state.debts.filter(d => {
    const p = personById(d.personId);
    return (p && p.name.toLowerCase().includes(q)) || (d.note || '').toLowerCase().includes(q);
  });
  if(!byCat.length && !byNote.length && !byLoan.length){
    return '<div class="list"><p class="empty">Nothing matches “'+esc(raw.trim())+'” in your categories, notes, or loans.</p></div>';
  }
  let html = '';
  if(byCat.length) html += '<h2>Category matches</h2><p class="section-note num">'+groupMeta(byCat)+'</p><div class="list">'+resultGroup(byCat)+'</div>';
  if(byNote.length) html += '<h2>Found in notes</h2><p class="section-note num">'+groupMeta(byNote)+'</p><div class="list">'+resultGroup(byNote)+'</div>';
  if(byLoan.length) html += '<h2>Loans and paybacks</h2><p class="section-note num">'+groupMeta(byLoan)+'</p><div class="list">'+resultGroup(byLoan)+'</div>';
  return html;
}
function updateSearch(){
  const box = document.getElementById('q-results');
  if(box) box.innerHTML = searchResults(searchQuery);
  const clear = document.getElementById('q-clear');
  if(clear) clear.hidden = !searchQuery;
}

function renderInsights(){
  const s = statsAll();
  const cur = currentMonth();
  const used = allMonths().filter(k => statsFor(k).count > 0).sort();
  const n = used.length;
  const range = n === 0 ? 'Nothing logged yet' : n === 1 ? monthLabel(used[0]) : monthLabel(used[0]) + ' to ' + monthLabel(used[n-1]);
  const avg = v => money(n ? Math.round(v / n) : 0);

  let html = topbar(backLink('#','All months')) + banner();
  html += '<label class="search">'+ICON_SEARCH +
    '<input id="q" type="search" placeholder="Search categories, notes, people" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search entries" value="'+esc(searchQuery)+'">' +
    '<button type="button" id="q-clear" aria-label="Clear search"'+(searchQuery ? '' : ' hidden')+'>'+ICON_X+'</button></label>' +
    '<div class="results" id="q-results">'+searchResults(searchQuery)+'</div>';

  html += '<section class="panel">' +
    '<h1>All-time insights</h1>' +
    '<p class="caption">'+range+(n > 1 ? ' ('+n+' months)' : '')+'</p>' +
    '<p class="big num '+netClass(s.net)+'">'+money(s.net)+'</p>' +
    '<p class="caption">'+(s.net < 0 ? 'more went out than came in overall' : 'saved overall')+(used.includes(cur) ? ', including '+monthName(cur)+' so far' : '')+'</p>' +
    ribbon(s) + inOut(s, true) +
  '</section>';

  html += '<h2>Where your money went</h2><p class="section-note">'+(s.cameIn
      ? 'Each category as a share of all the money that came in, with the average per month.'
      : 'Add a salary to see what share of your money each category takes.')+'</p><div class="list">';
  const rows = cats().slice().sort((a,b) => s.cats[b.id] - s.cats[a.id]).map(c => ({name:esc(c.name), color:c.color, v:s.cats[c.id]}));
  if(s.loanOut > 0) rows.push({name:'Lent out and repaid loans', color:'var(--loan)', v:s.loanOut});
  if(s.net > 0) rows.push({name:'Saved', color:'var(--in)', v:s.net});
  html += rows.map(r => {
    const width = s.cameIn ? Math.min(100, r.v / s.cameIn * 100) : 0;
    return '<div class="cat-row'+(r.v ? '' : ' zero')+'"><i class="dot" style="background:'+r.color+'"></i>' +
      '<span class="cat-name">'+r.name+'<small class="num">avg '+avg(r.v)+' a month</small></span>' +
      '<span class="cat-amt num">'+money(r.v)+'<small>'+pctOf(r.v, s.cameIn)+'</small></span>' +
      '<div class="cat-bar"><span style="width:'+width.toFixed(1)+'%;background:'+r.color+'"></span></div></div>';
  }).join('') + '</div>';
  if(s.net < 0 && s.cameIn){
    html += '<p class="footnote">'+money(-s.net)+' more went out than came in, so the rows add up to more than 100%.</p>';
  }
  html += '<h2>Money in</h2><div class="list">' +
    '<div class="kv"><span>Salary<small>'+plural(s.paychecks,'paycheck')+'</small></span><strong class="num in-text">'+money(s.salary)+'</strong></div>' +
    (s.deposit ? '<div class="kv"><span>Deposits</span><strong class="num in-text">'+money(s.deposit)+'</strong></div>' : '') +
    (s.loanIn ? '<div class="kv"><span>Paybacks and borrowed money</span><strong class="num in-text">'+money(s.loanIn)+'</strong></div>' : '') +
  '</div>';
  return html;
}

/* ----- owed to you, and money you owe ----- */
function debtButtons(pid){
  const d = pid ? ' data-person="'+pid+'"' : '';
  return '<div class="row-btns">' +
    '<button class="btn out-fill" data-action="debt" data-type="lent"'+d+'>'+ICON_MINUS+(pid ? 'Lent more' : 'Lent money')+'</button>' +
    '<button class="btn in-fill" data-action="debt" data-type="paid"'+d+'>'+ICON_PLUS+(pid ? 'Paid you back' : 'Got paid back')+'</button>' +
    '<button class="btn in-fill" data-action="debt" data-type="borrowed"'+d+'>'+ICON_PLUS+'Borrowed'+'</button>' +
    '<button class="btn out-fill" data-action="debt" data-type="repaid"'+d+'>'+ICON_MINUS+(pid ? 'You repaid' : 'Repaid a loan')+'</button>' +
  '</div>';
}
function renderOwed(){
  const o = owedTotals();
  const list = state.people.map(p => ({p:p, st:personStats(p.id)}))
    .sort((a,b) => (b.st.net !== 0) - (a.st.net !== 0) || b.st.net - a.st.net || a.p.name.localeCompare(b.p.name));

  let html = topbar(backLink('#','Home')) + banner();
  html += '<section class="panel">' +
    '<div class="io">' +
      '<div><span>Owed to you</span><strong class="owed-big num owed-text">'+money(o.theyOwe)+'</strong><small class="io-sub">'+(o.owers ? 'from '+peopleCount(o.owers) : 'nobody right now')+'</small></div>' +
      '<div><span>You owe</span><strong class="owed-big num '+(o.iOwe ? 'out-text' : 'quiet')+'">'+money(o.iOwe)+'</strong><small class="io-sub">'+(o.owees ? 'to '+peopleCount(o.owees) : 'nobody right now')+'</small></div>' +
    '</div>' + debtButtons('') +
  '</section>';

  html += '<h2>People</h2><div class="list">';
  if(!list.length){
    html += '<p class="empty">When you lend someone money, tap <strong>Lent money</strong>. When someone lends you money, tap <strong>Borrowed money</strong>. Each person gets their own running balance.</p>';
  } else {
    html += list.map(({p, st}) => {
      const n = st.net;
      const sub = n > 0 ? 'owes you'+(st.openLent.length ? ', '+plural(st.openLent.length,'open loan') : '')
        : n < 0 ? 'you owe them'+(st.openBorrowed.length ? ', '+plural(st.openBorrowed.length,'open loan') : '')
        : 'all square';
      const amt = n > 0 ? '<span class="prow-amt num owed-text">'+money(n)+'</span>'
        : n < 0 ? '<span class="prow-amt num out-text">'+money(n)+'</span>'
        : '<span class="prow-amt in-text">'+ICON_CHECK+'</span>';
      return '<a class="prow" href="#p='+p.id+'"><span><span class="prow-name">'+esc(p.name)+'</span><span class="prow-sub">'+sub+'</span></span>'+amt+'</a>';
    }).join('');
  }
  html += '</div>';
  html += '<p class="footnote">Lending money or repaying a loan comes out of that month’s money. Getting paid back or borrowing adds to it. What people still owe you never counts until they actually pay you.</p>';
  return html;
}

function loanRow(l, r){
  const lent = l.type === 'lent';
  const part = r.rem < l.amount;
  return '<div class="loan"><button class="entry" data-action="edit-debt" data-id="'+l.id+'">' +
    '<span class="badge '+(lent ? 'out' : 'in')+'">'+(lent ? ICON_MINUS : ICON_PLUS)+'</span>' +
    '<span class="entry-main"><span class="entry-title num">'+money(r.rem)+(part ? ' <span class="of">left of '+money(l.amount)+'</span>' : '')+'</span>' +
      '<span class="entry-note">'+(lent ? 'Lent on ' : 'Borrowed on ')+dayLabel(l.date)+(l.note ? ', '+esc(l.note) : '')+'</span></span><span></span>' +
    '</button><button class="mini '+(lent ? 'in-fill' : 'out-fill')+'" data-action="settle" data-id="'+l.id+'">'+(lent ? 'Mark paid' : 'Mark repaid')+'</button></div>';
}
function historyRow(d, r){
  if(isLoan(d.type)){
    const lent = d.type === 'lent';
    return '<button class="entry" data-action="edit-debt" data-id="'+d.id+'">' +
      '<span class="badge done">'+ICON_CHECK+'</span>' +
      '<span class="entry-main"><span class="entry-title">'+(lent ? 'Paid off on ' : 'You paid it off on ')+dayLabel(r.paidOn)+'</span>' +
        '<span class="entry-note">'+(lent ? 'Loan from ' : 'Borrowed on ')+dayLabel(d.date)+(d.note ? ', '+esc(d.note) : '')+'</span></span>' +
      '<span class="entry-side"><span class="entry-amt num struck">'+money(d.amount)+'</span></span>' +
    '</button>';
  }
  const inn = d.type === 'paid';
  return '<button class="entry" data-action="edit-debt" data-id="'+d.id+'">' +
    '<span class="badge '+(inn ? 'in' : 'out')+'">'+(inn ? ICON_PLUS : ICON_MINUS)+'</span>' +
    '<span class="entry-main"><span class="entry-title">'+(inn ? 'Paid you back' : 'You paid back')+'</span>' +
      (d.note ? '<span class="entry-note">'+esc(d.note)+'</span>' : '') + '</span>' +
    '<span class="entry-side"><span class="entry-amt num '+(inn ? 'in-text' : 'out-text')+'">'+money(inn ? d.amount : -d.amount, {sign:true})+'</span><span class="entry-date">'+dayLabel(d.date)+'</span></span>' +
  '</button>';
}
function renderPerson(pid){
  const p = personById(pid);
  if(!p) return renderOwed();
  const st = personStats(pid), n = st.net, name = esc(p.name), A = st.alloc;
  const openLent = st.openLent.slice().sort(byNewest), openBor = st.openBorrowed.slice().sort(byNewest);
  const evDate = d => isLoan(d.type) ? A[d.id].paidOn : d.date;
  // A "Mark paid" payment is shown by its crossed-off loan, so it isn't listed twice.
  const payments = st.ds.filter(d => !isLoan(d.type) && !(d.loanId && A[d.loanId]));
  const history = st.paidLoans.concat(payments)
    .sort((a,b) => evDate(b).localeCompare(evDate(a)) || (b.createdAt||0) - (a.createdAt||0));

  let html = topbar(backLink('#owed','Owed to you')) + banner();
  html += '<section class="panel">' +
    '<h1>'+name+'</h1>' +
    '<p class="big num '+(n > 0 ? 'owed-text' : n < 0 ? 'out-text' : 'in-text')+'">'+money(Math.abs(n))+'</p>' +
    '<p class="caption">'+(n > 0 ? 'owes you' : n < 0 ? 'you owe '+name : 'you’re all square')+'</p>' +
    (st.theyOwe > 0 && st.iOwe > 0 ? '<p class="caption">'+name+' owes you '+money(st.theyOwe)+' and you owe them '+money(st.iOwe)+'.</p>' : '') +
    '<div class="io" style="margin-top:18px">' +
      (st.lent || !st.borrowed ? '<div><span>You lent</span><strong class="num out-text">'+money(st.lent)+'</strong></div>' +
        '<div><span>Paid you back</span><strong class="num in-text">'+money(st.paid)+'</strong></div>' : '') +
      (st.borrowed ? '<div><span>You borrowed</span><strong class="num in-text">'+money(st.borrowed)+'</strong></div>' +
                     '<div><span>You repaid</span><strong class="num out-text">'+money(st.repaid)+'</strong></div>' : '') +
    '</div>' + debtButtons(pid) +
  '</section>';

  if(st.lent || !st.borrowed){
    html += '<h2>'+name+' still owes you</h2>' +
      (openLent.length ? '<p class="section-note">Payments go toward the oldest loan first.</p>' : '') +
      '<div class="list">' + (openLent.length ? openLent.map(l => loanRow(l, A[l.id])).join('')
        : '<p class="empty">No open loans. Tap <strong>Lent more</strong> when '+name+' borrows money.</p>') + '</div>';
  }
  if(st.borrowed){
    html += '<h2>You still owe '+name+'</h2>' +
      (openBor.length ? '<p class="section-note">Your repayments go toward the oldest loan first.</p>' : '') +
      '<div class="list">' + (openBor.length ? openBor.map(l => loanRow(l, A[l.id])).join('')
        : '<p class="empty">You don’t owe '+name+' anything.</p>') + '</div>';
  }

  html += '<h2>History</h2><p class="section-note">Paid-off loans stay here, crossed out, along with every payment.</p><div class="list">' +
    (history.length ? history.map(d => historyRow(d, A[d.id])).join('') : '<p class="empty">Nothing paid back yet.</p>') + '</div>';

  html += '<div class="row-btns" style="margin-top:24px">' +
    '<button class="btn" data-action="rename-person" data-person="'+pid+'">Rename</button>' +
    '<button class="btn danger" data-action="delete-person" data-person="'+pid+'">Delete '+name+'</button></div>';
  return html;
}

/* ================= routing ================= */
const app = document.getElementById('app');
function route(){
  const h = location.hash;
  if(h === '#insights') return {view:'insights'};
  if(h === '#owed') return {view:'owed'};
  let m = h.match(/^#m=(\d{4}-\d{2})$/); if(m) return {view:'month', k:m[1]};
  m = h.match(/^#p=([\w-]+)$/); if(m) return {view:'person', id:m[1]};
  return {view:'home'};
}
function render(){
  const r = route();
  app.innerHTML = r.view === 'month' ? renderMonth(r.k)
    : r.view === 'insights' ? renderInsights()
    : r.view === 'owed' ? renderOwed()
    : r.view === 'person' ? renderPerson(r.id)
    : renderHome();
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });
document.addEventListener('input', e => {
