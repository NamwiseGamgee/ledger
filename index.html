/* ================= sheets ================= */
let lastFocus = null;
function openSheet(inner, label){
  closeSheet();
  lastFocus = document.activeElement;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(label)+'"><div class="grabber"></div>'+inner+'</div>';
  ov.addEventListener('click', e => { if(e.target === ov) closeSheet(); });
  document.body.appendChild(ov);
  document.body.classList.add('locked');
  return ov.querySelector('.sheet');
}
function closeSheet(){
  const ov = document.querySelector('.overlay');
  if(!ov) return;
  ov.remove();
  document.body.classList.remove('locked');
  if(lastFocus && document.body.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

/* ----- add or edit a budget entry ----- */
function openEntry(opts){
  const entry = opts.entry || null;
  const month = opts.month || currentMonth();
  const draft = entry ? {type:entry.type, category:catOf(entry).id}
                      : {type:opts.type || 'expense', category:(catById('grocery') || cats()[0]).id};
  const date = entry ? entry.date : (month === currentMonth() ? todayStr() : month + '-01');
  const segTypes = entry && entry.type === 'deposit' ? TYPES : ['salary','expense'];

  const html =
    '<h3>'+(entry ? 'Edit entry' : 'New entry')+'</h3>' +
    '<div class="seg" role="group" aria-label="Entry type" style="--segs:'+segTypes.length+'">' +
      segTypes.map(t => '<button type="button" data-t="'+t+'">'+TYPE_NAME[t]+'</button>').join('') + '</div>' +
    amountField('f-amount', entry ? (entry.amount/100).toFixed(2) : '') +
    '<p class="err" id="f-err" role="alert"></p>' +
    '<div class="field" id="f-cat"><span>Category</span><div class="chips" id="f-chips"></div>' +
      '<div id="f-newcat" hidden><div class="new-cat"><input class="input" id="f-newcat-name" maxlength="30" autocomplete="off" placeholder="New category name" aria-label="New category name">' +
      '<button type="button" class="btn primary" id="f-newcat-add">Add</button></div><div id="f-newcat-pick"></div></div>' +
    '</div>' +
    '<label class="field"><span>Date</span><input class="input" type="date" id="f-date" value="'+date+'"></label>' +
    '<label class="field"><span>Note</span><input class="input" id="f-note" maxlength="300" autocomplete="off" value="'+(entry ? esc(entry.note || '') : '')+'"></label>' +
    '<div class="actions">' +
      '<button class="btn" id="f-save">'+(entry ? 'Save changes' : 'Add entry')+'</button>' +
      (entry ? '<button class="btn danger" id="f-del">Delete entry</button>' : '') +
      '<button class="btn plain" id="f-cancel">Cancel</button>' +
    '</div>';

  const sheet = openSheet(html, entry ? 'Edit entry' : 'New entry');
  const $ = sel => sheet.querySelector(sel);
  const amountIn = $('#f-amount'), dateIn = $('#f-date'), noteIn = $('#f-note'), err = $('#f-err'), saveBtn = $('#f-save');
  const chipsEl = $('#f-chips'), newCatRow = $('#f-newcat'), newCatIn = $('#f-newcat-name');
  let newCatColor = null;

  function drawChips(){
    chipsEl.innerHTML = cats().map(c => '<button type="button" class="chip" data-c="'+c.id+'"><i class="dot" style="background:'+c.color+'"></i>'+esc(c.name)+'</button>').join('') +
      '<button type="button" class="chip add-chip" data-new="1">'+ICON_PLUS+'New category</button>';
  }
  function sync(){
    const isExp = draft.type === 'expense';
    $('#f-cat').hidden = !isExp;
    sheet.classList.toggle('is-out', isExp);
    sheet.classList.toggle('is-in', !isExp);
    saveBtn.className = 'btn ' + (isExp ? 'out-fill' : 'in-fill');
    sheet.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === draft.type)));
    chipsEl.querySelectorAll('[data-c]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === draft.category)));
    noteIn.placeholder = NOTE_HINT[draft.type];
  }
  drawChips(); sync();
  wireCalc(sheet, amountIn);
  sheet.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { draft.type = b.dataset.t; sync(); }));
  chipsEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if(!b) return;
    if(b.dataset.new){
      if(newCatRow.hidden){
        const pick = $('#f-newcat-pick');
        pick.innerHTML = pickerHTML();
        wirePicker(pick, nextColor(), c => { newCatColor = c; });
      }
      newCatRow.hidden = false; newCatIn.focus(); return;
    }
    draft.category = b.dataset.c; sync();
  });
  function addNewCat(){
    const r = addCategory(newCatIn.value, newCatColor);
    if(r.error){ err.textContent = r.error; newCatIn.focus(); return; }
    if(!save()) return;
    err.textContent = '';
    draft.category = r.cat.id;
    newCatIn.value = ''; newCatRow.hidden = true;
    drawChips(); sync();
    toast(r.cat.name + ' added to your categories');
  }
  $('#f-newcat-add').addEventListener('click', addNewCat);
  newCatIn.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); addNewCat(); } });

  function submit(){
    const amount = parseAmount(amountIn.value);
    if(!(amount > 0)){ err.textContent = 'Enter an amount that works out to more than 0.'; amountIn.focus(); return; }
    if(!DATE_RE.test(dateIn.value)){ err.textContent = 'Pick a date for this entry.'; dateIn.focus(); return; }
    const rec = {
      id: entry ? entry.id : uid(), type: draft.type, amount: amount, date: dateIn.value,
      note: noteIn.value.trim(), createdAt: entry ? (entry.createdAt || Date.now()) : Date.now()
    };
    if(rec.type === 'expense') rec.category = draft.category;
    if(entry){
      const i = state.entries.findIndex(x => x.id === entry.id);
      if(i >= 0) state.entries[i] = rec; else state.entries.push(rec);
    } else state.entries.push(rec);
    if(!save()) return;
    closeSheet(); render();
    const name = rec.type === 'expense' ? catOf(rec).name : TYPE_NAME[rec.type];
    toast(entry ? 'Changes saved' : name + ' added to ' + monthName(monthOf(rec.date)));
  }
  saveBtn.addEventListener('click', submit);
  $('#f-cancel').addEventListener('click', closeSheet);
  [amountIn, noteIn].forEach(el => el.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submit(); } }));
  amountIn.addEventListener('input', () => { err.textContent = ''; });
  if(entry){
    $('#f-del').addEventListener('click', () => {
      if(!confirm('Delete this entry?')) return;
      state.entries = state.entries.filter(x => x.id !== entry.id);
      if(save()){ closeSheet(); render(); toast('Entry deleted'); }
    });
  } else amountIn.focus();
}

/* ----- loans: lent, paid back, borrowed, repaid ----- */
const DEBT_UI = {
  lent:     {title:'Lent money',        edit:'Edit loan',           who:'Who borrowed it?',      fixed:'Lent to',       save:'Add loan',         note:'What was it for? (optional)'},
  paid:     {title:'Got paid back',     edit:'Edit payback',        who:'Who paid you back?',    fixed:'Paid back by',  save:'Record payback',   note:'e.g. Cash, Zelle (optional)'},
  borrowed: {title:'Borrowed money',    edit:'Edit borrowed money', who:'Who lent it to you?',   fixed:'Borrowed from', save:'Add',              note:'What was it for? (optional)'},
  repaid:   {title:'Repaid a loan',     edit:'Edit repayment',      who:'Who did you pay back?', fixed:'Paid back to',  save:'Record repayment', note:'e.g. Cash, Zelle (optional)'}
};
// Paybacks can't be more than they owe you; repayments can't be more than you owe them.
const openFor = (st, type) => type === 'paid' ? st.theyOwe : st.iOwe;

function openDebt(opts){
  const debt = opts.debt || null;
  const type = debt ? debt.type : opts.type;
  const ui = DEBT_UI[type], loan = isLoan(type), inn = !!DEBT_IN[type];
  let personId = debt ? debt.personId : (opts.personId || null);
  const nothing = pid => type === 'paid' ? personById(pid).name+' doesn’t owe you anything right now' : 'You don’t owe '+personById(pid).name+' anything right now';
  const choices = (loan ? state.people.slice() : state.people.filter(p => openFor(personStats(p.id), type) > 0 || (debt && p.id === personId)))
    .sort((a,b) => a.name.localeCompare(b.name));
  if(!loan && !debt){
    if(!choices.length){ toast(type === 'paid' ? 'Nobody owes you anything right now' : 'You don’t owe anyone right now'); return; }
    if(personId && !choices.some(p => p.id === personId)){ toast(nothing(personId)); return; }
    if(!personId && choices.length === 1) personId = choices[0].id;
  }

  // For an existing loan: how much is left, and whether it was crossed off with "Mark paid".
  const info = debt && loan ? personStats(debt.personId).alloc[debt.id] : null;
  const markPays = debt && loan ? state.debts.filter(d => d.loanId === debt.id) : [];
  const markedOff = !!(info && info.rem === 0 && markPays.length);
  const status = !info ? ''
    : info.rem === 0 ? (type === 'lent' ? 'Paid off on ' : 'You paid it off on ')+dayLabel(info.paidOn)+'.'
    : info.rem < debt.amount ? money(debt.amount - info.rem)+' paid so far, '+money(info.rem)+' left.'
    : 'Nothing paid back yet.';

  const title = debt ? ui.edit : ui.title;
  const html = '<h3>'+title+'</h3>' +
    (debt
      ? '<p class="help" style="margin-top:-8px">'+ui.fixed+' <strong>'+esc(personById(personId).name)+'</strong>'+(status ? '. '+status : '')+'</p>'
      : '<div class="field" style="margin-top:0"><span>'+ui.who+'</span><div class="chips" id="d-people">' +
          choices.map(p => '<button type="button" class="chip" data-p="'+p.id+'">'+esc(p.name)+'</button>').join('') + '</div>' +
          (loan ? '<input class="input" id="d-newname" maxlength="40" autocomplete="off" placeholder="'+(choices.length ? 'Or type a new name' : 'Type their name')+'" aria-label="Person’s name" style="margin-top:10px">' : '') +
        '</div>') +
    amountField('d-amount', debt ? (debt.amount/100).toFixed(2) : '') +
    '<p class="help" id="d-hint"></p>' +
    '<p class="err" id="d-err" role="alert"></p>' +
    '<label class="field"><span>Date</span><input class="input" type="date" id="d-date" value="'+(debt ? debt.date : todayStr())+'"></label>' +
    '<label class="field"><span>Note</span><input class="input" id="d-note" maxlength="300" autocomplete="off" placeholder="'+ui.note+'" value="'+(debt ? esc(debt.note || '') : '')+'"></label>' +
    '<div class="actions">' +
      '<button class="btn '+(inn ? 'in-fill' : 'out-fill')+'" id="d-save">'+(debt ? 'Save changes' : ui.save)+'</button>' +
      (markedOff ? '<button class="btn" id="d-unsettle">'+(type === 'lent' ? 'Mark as not paid back' : 'Mark as not repaid')+'</button>' : '') +
      (debt ? '<button class="btn danger" id="d-del">Delete</button>' : '') +
      '<button class="btn plain" id="d-cancel">Cancel</button>' +
    '</div>';

  const sheet = openSheet(html, title);
  sheet.classList.add(inn ? 'is-in' : 'is-out');
  const $ = sel => sheet.querySelector(sel);
  const amountIn = $('#d-amount'), err = $('#d-err'), hint = $('#d-hint'), newName = $('#d-newname');
  wireCalc(sheet, amountIn);

  function limitFor(pid){ return openFor(personStats(pid), type) + (debt ? debt.amount : 0); }
  // Loans can't add up to less than what has already been paid back on them.
  function tooLow(pid, paid){
    const who = personById(pid).name;
    return (type === 'lent' ? who+' has already paid you back '+moneyText(paid) : 'You’ve already paid '+who+' back '+moneyText(paid)) +
      ', so the loans can’t add up to less than that. Edit or delete a payment first.';
  }
  function loanCheck(pid, loanChange, paidChange){
    const st = personStats(pid);
    const paidAfter = (type === 'lent' ? st.paid : st.repaid) + paidChange;
    const totalAfter = (type === 'lent' ? st.lent : st.borrowed) + loanChange;
    return totalAfter < paidAfter ? tooLow(pid, paidAfter) : '';
  }
  function sync(){
    sheet.querySelectorAll('[data-p]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === personId)));
    const p = personId && personById(personId);
    hint.textContent = (!loan && p)
      ? (type === 'paid' ? p.name+' owes you '+moneyText(limitFor(p.id))+'.' : 'You owe '+p.name+' '+moneyText(limitFor(p.id))+'.')
      : '';
  }
  sync();
  const peopleEl = $('#d-people');
  if(peopleEl) peopleEl.addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if(!b) return;
    personId = b.dataset.p; if(newName) newName.value = ''; err.textContent = ''; sync();
  });
  if(newName) newName.addEventListener('input', () => { if(newName.value.trim()){ personId = null; sync(); } err.textContent = ''; });

  function submit(){
    const amount = parseAmount(amountIn.value);
    const date = $('#d-date').value;
    const typed = newName && newName.value.trim();
    let pid = personId;
    if(!debt && typed){
      const existing = state.people.find(p => p.name.toLowerCase() === typed.toLowerCase());
      pid = existing ? existing.id : null;
    }
    if(!pid && !typed){ err.textContent = loan ? 'Choose a person or type a name.' : 'Choose a person.'; return; }
    if(!(amount > 0)){ err.textContent = 'Enter an amount that works out to more than 0.'; amountIn.focus(); return; }
    if(!DATE_RE.test(date)){ err.textContent = 'Pick a date.'; return; }
    if(!loan){
      const lim = limitFor(pid), pname = personById(pid).name;
      if(amount > lim){
        err.textContent = lim <= 0 ? nothing(pid) + '.'
          : type === 'paid' ? pname+' only owes you '+moneyText(lim)+'.' : 'You only owe '+pname+' '+moneyText(lim)+'.';
        amountIn.focus(); return;
      }
    }
    const delta = debt ? amount - debt.amount : 0;
    if(loan && debt){
      // Payments are real money, so they never change here. If a loan is corrected downward,
      // anything already paid on it goes toward the next oldest loan instead.
      const problem = loanCheck(pid, delta, 0);
      if(problem){ err.textContent = problem; amountIn.focus(); return; }
    }
    if(!pid) pid = findOrCreatePerson(typed).id;
    const note = $('#d-note').value.trim();
    if(debt){
      debt.amount = amount; debt.date = date; debt.note = note;
    } else {
      state.debts.push({id:'d_'+uid(), personId:pid, type:type, amount:amount, date:date, note:note, createdAt:Date.now()});
    }
    if(!save()) return;
    closeSheet(); render();
    toast(debt ? 'Changes saved' : summary(pid));
  }
  $('#d-save').addEventListener('click', submit);
  $('#d-cancel').addEventListener('click', closeSheet);
  amountIn.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
  amountIn.addEventListener('input', () => { err.textContent = ''; });
  if(debt){
    $('#d-del').addEventListener('click', () => {
      if(loan){
        const linked = markPays.reduce((s,d) => s + d.amount, 0);
        const problem = loanCheck(debt.personId, -debt.amount, -linked);
        if(problem){ err.textContent = problem; return; }
      }
      if(!confirm(loan ? 'Delete this loan?'+(markPays.length ? ' The payment recorded when you marked it paid is removed too.' : '') : 'Delete this payment?')) return;
      state.debts = state.debts.filter(d => d.id !== debt.id && d.loanId !== debt.id);
      if(save()){ closeSheet(); render(); toast('Deleted'); }
    });
    const un = $('#d-unsettle');
    if(un) un.addEventListener('click', () => { closeSheet(); unsettleLoan(debt); });
  } else if(!loan || personId) amountIn.focus();
}

// "Mark paid" / "Mark repaid": records a payment for exactly what's left on this loan.
function settleLoan(loan){
  const r = personStats(loan.personId).alloc[loan.id];
  if(!r || r.rem <= 0) return;
  state.debts.push({id:'d_'+uid(), personId:loan.personId, type:PAY_FOR[loan.type], amount:r.rem, date:todayStr(), note:'', loanId:loan.id, createdAt:Date.now()});
  if(!save()) return;
  render();
  toast((loan.type === 'lent' ? 'Marked paid. ' : 'Marked repaid. ') + summary(loan.personId));
}
// Undo "Mark paid": removes the payment it recorded.
function unsettleLoan(loan){
  state.debts = state.debts.filter(d => d.loanId !== loan.id);
  if(save()){ render(); toast('Loan is open again'); }
}
function renamePerson(pid){
  const p = personById(pid);
  const sheet = openSheet('<h3>Rename '+esc(p.name)+'</h3><input class="input" id="r-name" maxlength="40" autocomplete="off" value="'+esc(p.name)+'" aria-label="Name">' +
    '<p class="err" id="r-err" role="alert"></p><div class="actions"><button class="btn primary" id="r-save">Save</button><button class="btn plain" id="r-cancel">Cancel</button></div>', 'Rename');
  const input = sheet.querySelector('#r-name');
  input.focus(); input.select();
  function go(){
    const name = input.value.trim().slice(0,40);
    if(!name){ sheet.querySelector('#r-err').textContent = 'Type a name.'; return; }
    if(state.people.some(x => x.id !== pid && x.name.toLowerCase() === name.toLowerCase())){ sheet.querySelector('#r-err').textContent = 'Someone with that name is already on your list.'; return; }
    p.name = name;
    if(save()){ closeSheet(); render(); toast('Renamed to '+name); }
  }
  sheet.querySelector('#r-save').addEventListener('click', go);
  sheet.querySelector('#r-cancel').addEventListener('click', closeSheet);
  input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); go(); } });
}
function deletePerson(pid){
  const p = personById(pid);
  if(!confirm('Delete '+p.name+' and their whole loan and payback history? This can\u2019t be undone.')) return;
  state.people = state.people.filter(x => x.id !== pid);
  state.debts = state.debts.filter(d => d.personId !== pid);
  if(save()){ location.hash = '#owed'; render(); toast(p.name+' deleted'); }
}

/* ----- settings ----- */
function openSettings(){
  const currencies = ['$','€','£','₹','৳','¥','₱','₦','C$','A$'];
  if(!currencies.includes(state.currency)) currencies.unshift(state.currency);
  const last = state.lastBackup
    ? 'Last backup: ' + new Date(state.lastBackup).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})
    : 'No backup downloaded yet';
  const count = state.entries.length, owedCount = state.debts.length;

  const html =
    '<h3>Settings</h3>' +
    '<label class="field"><span>Currency symbol</span><select class="input" id="s-cur">' +
      currencies.map(c => '<option'+(c === state.currency ? ' selected' : '')+'>'+esc(c)+'</option>').join('') + '</select></label>' +
    '<div class="field"><span>Expense categories</span><button class="btn" id="s-cats" style="width:100%">Manage categories ('+cats().length+')</button></div>' +
    '<div class="data-box"><strong>'+plural(count,'entry').replace('entrys','entries')+(owedCount ? ' and '+plural(owedCount,'owed-money record') : '')+' saved on this device</strong>' +
      '<p class="help">Everything stays on this device until you delete it. Each device keeps its own copy, so to move your data, download a backup here and restore it on the other device.</p>' +
      '<p class="help">'+last+'</p></div>' +
    '<div class="actions">' +
      '<button class="btn primary" id="s-backup">Download backup</button>' +
      '<button class="btn" id="s-restore">Restore from backup</button>' +
      '<button class="btn danger" id="s-wipe">Delete all data</button>' +
      '<button class="btn plain" id="s-close">Done</button>' +
    '</div>';

  const sheet = openSheet(html, 'Settings');
  const $ = sel => sheet.querySelector(sel);
  $('#s-cur').addEventListener('change', e => { state.currency = e.target.value; save(); render(); });
  $('#s-cats').addEventListener('click', openCategories);
  $('#s-backup').addEventListener('click', exportData);
  $('#s-restore').addEventListener('click', () => document.getElementById('restore-input').click());
  $('#s-close').addEventListener('click', closeSheet);
  $('#s-wipe').addEventListener('click', () => {
    if(!state.entries.length && !state.debts.length){ toast('There is nothing to delete'); return; }
    if(!confirm('Delete every budget entry and every owed-money record? Your categories and currency stay. This can\u2019t be undone.')) return;
    state.entries = []; state.people = []; state.debts = [];
    if(save()){ closeSheet(); location.hash = ''; render(); toast('All data deleted'); }
  });
}

/* ----- color picker: quick colors, any color from the system picker, or hue/strength/brightness sliders ----- */
function hexToHsl(hex){
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), l = (max + min) / 2;
  let h = 0, s = 0;
  if(max !== min){
    const d = max - min;
    s = l > .5 ? d / (2 - max - min) : d / (max + min);
    h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [Math.round(h), Math.round(s*100), Math.round(l*100)];
}
function hslToHex(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h/30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))).toString(16).padStart(2,'0');
  return ('#' + f(0) + f(8) + f(4)).toUpperCase();
}
function pickerHTML(){
  const slider = (id, label, max) => '<label class="pk-row"><span>'+label+'</span><input class="pk" type="range" id="'+id+'" min="0" max="'+max+'" step="1"></label>';
  return '<div class="field"><span>Color</span></div>' +
    '<div class="swatches" role="group" aria-label="Quick colors">' +
      PALETTE.map(p => '<button type="button" class="swatch" data-color="'+p+'" style="background:'+p+'" aria-label="Color '+p+'"></button>').join('') +
      '<label class="swatch rainbow" title="Pick any color"><input type="color" id="pk-native" aria-label="Pick any color"></label>' +
    '</div>' +
    '<div class="pk-top"><span class="pk-preview" id="pk-prev"></span>' +
      '<input class="input pk-hex" id="pk-hex" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Color code, like #1E88E5"></div>' +
    slider('pk-h','Hue',360) + slider('pk-s','Strength',100) + slider('pk-l','Brightness',100);
}
function wirePicker(root, initial, onChange){
  const $ = sel => root.querySelector(sel);
  const H = $('#pk-h'), S = $('#pk-s'), L = $('#pk-l'), hexIn = $('#pk-hex'), prev = $('#pk-prev'), nat = $('#pk-native');
  let hex = (HEX.test(initial) ? initial : PALETTE[0]).toUpperCase();
  function paint(){
    const h = +H.value, s = +S.value, l = +L.value;
    S.style.background = 'linear-gradient(90deg,'+hslToHex(h,0,l)+','+hslToHex(h,100,l)+')';
    L.style.background = 'linear-gradient(90deg,#000,'+hslToHex(h,s,50)+',#fff)';
    prev.style.background = hex;
    if(document.activeElement !== hexIn) hexIn.value = hex;
    nat.value = hex.toLowerCase();
    root.querySelectorAll('.swatch[data-color]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.color === hex)));
  }
  function setHex(v, fromSliders){
    hex = v.toUpperCase();
    if(!fromSliders){ const hsl = hexToHsl(hex); H.value = hsl[0]; S.value = hsl[1]; L.value = hsl[2]; }
    paint(); onChange(hex);
  }
  [H,S,L].forEach(r => r.addEventListener('input', () => setHex(hslToHex(+H.value, +S.value, +L.value), true)));
  hexIn.addEventListener('input', () => { let v = hexIn.value.trim(); if(v[0] !== '#') v = '#' + v; if(HEX.test(v)) setHex(v); });
  hexIn.addEventListener('blur', () => { hexIn.value = hex; });
  nat.addEventListener('input', () => setHex(nat.value));
  root.querySelectorAll('.swatch[data-color]').forEach(b => b.addEventListener('click', () => setHex(b.dataset.color)));
  setHex(hex);
}

function openCategories(){
  const sheet = openSheet('<div id="c-body"></div>', 'Categories');
  const body = sheet.querySelector('#c-body');
  let editing = null, deleting = null, color = nextColor();
  const countFor = id => state.entries.filter(e => e.type === 'expense' && e.category === id).length;

  function draw(){
    if(deleting){
      const c = catById(deleting), n = countFor(deleting);
      const others = cats().filter(x => x.id !== deleting);
      const fallback = (others.find(x => x.id === 'other') || others[0]).id;
      body.innerHTML = '<h3>Delete '+esc(c.name)+'?</h3>' +
        '<p class="help">'+plural(n,'expense')+' '+(n === 1 ? 'is' : 'are')+' filed under '+esc(c.name)+', including in past months. Choose where to move '+(n === 1 ? 'it' : 'them')+' so your monthly totals stay the same.</p>' +
        '<label class="field"><span>Move to</span><select class="input" id="c-move">' +
          others.map(x => '<option value="'+x.id+'"'+(x.id === fallback ? ' selected' : '')+'>'+esc(x.name)+'</option>').join('') + '</select></label>' +
        '<div class="actions"><button class="btn out-fill" id="c-confirm">Move and delete</button><button class="btn plain" id="c-back">Cancel</button></div>';
      body.querySelector('#c-back').addEventListener('click', () => { deleting = null; draw(); });
      body.querySelector('#c-confirm').addEventListener('click', () => {
        const target = body.querySelector('#c-move').value;
        state.entries.forEach(e => { if(e.type === 'expense' && e.category === deleting) e.category = target; });
        state.categories = cats().filter(x => x.id !== deleting);
        if(save()){ toast(c.name+' deleted. Its expenses moved to '+catById(target).name); deleting = null; draw(); render(); }
      });
      return;
    }
    const ed = editing ? catById(editing) : null;
    body.innerHTML = '<h3>Categories</h3><p class="help">These are the choices you see when you add an expense.</p>' +
      '<div class="list" style="margin-top:14px">' + cats().map(x => {
        const n = countFor(x.id);
        return '<div class="cat-item"><i class="dot" style="background:'+x.color+'"></i>' +
          '<span class="cat-item-main"><span class="cat-name">'+esc(x.name)+'</span><span class="cat-count">'+(n ? plural(n,'expense') : 'Not used yet')+'</span></span>' +
          '<button type="button" class="mini" data-edit="'+x.id+'" aria-label="Edit '+esc(x.name)+'">Edit</button>' +
          '<button type="button" class="mini danger" data-del="'+x.id+'" aria-label="Delete '+esc(x.name)+'">Delete</button></div>';
      }).join('') + '</div>' +
      '<h4 class="sub">'+(ed ? 'Edit '+esc(ed.name) : 'Add a category')+'</h4>' +
      '<input class="input" id="c-name" maxlength="30" autocomplete="off" placeholder="e.g. Utilities, Gym, Gifts" aria-label="Category name" value="'+(ed ? esc(ed.name) : '')+'">' +
      pickerHTML() +
      '<p class="err" id="c-err" role="alert"></p>' +
      '<div class="actions">' + (ed
        ? '<button class="btn primary" id="c-save">Save changes</button><button class="btn plain" id="c-cancel">Cancel editing</button>'
        : '<button class="btn primary" id="c-add">Add category</button><button class="btn plain" id="c-done">Done</button>') + '</div>';

    const nameIn = body.querySelector('#c-name'), err = body.querySelector('#c-err');
    wirePicker(body, color, c => { color = c; });
    body.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => {
      editing = b.dataset.edit; color = catById(editing).color; draw(); body.querySelector('#c-name').focus();
    }));
    body.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      const c = catById(b.dataset.del);
      if(cats().length === 1){ toast('Keep at least one category'); return; }
      if(countFor(c.id) === 0){
        if(!confirm('Delete the '+c.name+' category?')) return;
        state.categories = cats().filter(x => x.id !== c.id);
        if(editing === c.id){ editing = null; color = nextColor(); }
        if(save()){ toast(c.name+' deleted'); draw(); render(); }
      } else { deleting = c.id; draw(); }
    }));
    function commit(){
      const name = nameIn.value.trim().slice(0,30);
      if(ed){
        const problem = checkCatName(name, ed.id);
        if(problem){ err.textContent = problem; nameIn.focus(); return; }
        ed.name = name; ed.color = color;
        if(!save()) return;
        toast('Changes saved');
      } else {
        const r = addCategory(name, color);
        if(r.error){ err.textContent = r.error; nameIn.focus(); return; }
        if(!save()) return;
        toast(r.cat.name+' added');
      }
      editing = null; color = nextColor(); draw(); render();
    }
    nameIn.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); commit(); } });
    nameIn.addEventListener('input', () => { err.textContent = ''; });
    body.querySelector(ed ? '#c-save' : '#c-add').addEventListener('click', commit);
    if(ed) body.querySelector('#c-cancel').addEventListener('click', () => { editing = null; color = nextColor(); draw(); });
    else body.querySelector('#c-done').addEventListener('click', closeSheet);
  }
  draw();
}

/* ----- backup & restore ----- */
async function exportData(){
  const payload = JSON.stringify({app:'ledger', version:3, colorsV2:true, exportedAt:new Date().toISOString(), currency:state.currency,
    categories:state.categories, entries:state.entries, people:state.people, debts:state.debts}, null, 2);
  const name = 'ledger-backup-' + todayStr() + '.json';
  const file = new File([payload], name, {type:'application/json'});
  const done = () => { state.lastBackup = Date.now(); save(); };
  if(isIOS && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); done(); toast('Backup ready'); closeSheet(); }
    catch(e){ if(e.name !== 'AbortError') toast('Could not share the backup file'); }
    return;
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  done(); toast('Backup downloaded'); closeSheet();
}

document.getElementById('restore-input').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!d || !Array.isArray(d.entries)) throw new Error('shape');
    const entries = d.entries.filter(x =>
      x && TYPES.includes(x.type) && Number.isInteger(x.amount) && x.amount > 0 && DATE_RE.test(x.date)
    ).map(x => {
      const r = {id: cleanId(x.id) || uid(), type:x.type, amount:x.amount, date:x.date,
                 note: typeof x.note === 'string' ? x.note.slice(0,300) : '', createdAt: Number(x.createdAt) || Date.now()};
      if(r.type === 'expense') r.category = cleanId(x.category);
      return r;
    });
    // Older backups have no owed-money records; in that case the ones on this device are kept.
    const hasOwed = Array.isArray(d.people);
    const when = d.exportedAt ? ' from ' + new Date(d.exportedAt).toLocaleDateString() : '';
    if(!confirm('Replace what\u2019s on this device with the backup'+when+' ('+plural(entries.length,'entry').replace('entrys','entries')+')?')) return;
    const next = normalize({currency:d.currency || state.currency, lastBackup:state.lastBackup, categories:d.categories, entries:entries,
      people: hasOwed ? d.people : state.people, debts: hasOwed ? d.debts : state.debts});
    state = next;
    if(save()){ closeSheet(); location.hash = ''; render(); toast('Backup restored'); }
  }catch(err){
    toast('That file isn\u2019t a Ledger backup');
  }
});

function deleteMonth(k){
  if(!confirm('Delete every budget entry in '+monthLabel(k)+'? Loans and paybacks stay on the Owed page. This can\u2019t be undone.')) return;
  state.entries = state.entries.filter(e => monthOf(e.date) !== k);
  if(save()){ location.hash = ''; render(); toast(monthLabel(k)+' deleted'); }
}

/* ================= button clicks ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if(!t || t.closest('.overlay')) return;
  const a = t.dataset.action;
  if(a === 'add') openEntry({type:t.dataset.type, month:t.dataset.month});
  else if(a === 'edit'){ const en = state.entries.find(x => x.id === t.dataset.id); if(en) openEntry({entry:en}); }
  else if(a === 'settings') openSettings();
  else if(a === 'delete-month') deleteMonth(t.dataset.month);
  else if(a === 'debt') openDebt({type:t.dataset.type, personId:t.dataset.person});
  else if(a === 'edit-debt'){ const d = state.debts.find(x => x.id === t.dataset.id); if(d) openDebt({debt:d}); }
  else if(a === 'settle'){ const d = state.debts.find(x => x.id === t.dataset.id); if(d) settleLoan(d); }
  else if(a === 'rename-person') renamePerson(t.dataset.person);
  else if(a === 'delete-person') deletePerson(t.dataset.person);
});

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// When the app is reopened in a new month, redraw so the right month is on top.
let shownMonth = currentMonth();
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && currentMonth() !== shownMonth){ shownMonth = currentMonth(); render(); }
});

if(isIOS && (navigator.standalone || matchMedia('(display-mode: standalone)').matches)){
  document.documentElement.classList.add('ios-app');
  // If the app fills the whole screen (page drawn under the status bar), leave room at the top.
  // If iPhone already starts the page below the status bar, add no extra space.
  const checkBar = () => {
    if(window.innerWidth > window.innerHeight) return;   // ignore landscape
    const full = Math.abs(screen.height - window.innerHeight) < 8;
    document.documentElement.classList.toggle('under-bar', full);
  };
  checkBar();
  window.addEventListener('resize', checkBar);
}
render();

if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
